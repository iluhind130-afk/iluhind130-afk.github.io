<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>С Днём Рождения!</title>
    <style>
        body {
            background-color: #ffeef2; /* Нежно-розовый фон */
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
            border: 2px solid #ffb6c1;
        }
        h1 {
            color: #ff4d6d;
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 18px;
            line-height: 1.5;
        }
        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">🎂✨</div>
        <h1>С Днём Рождения!</h1>
        <p>Пусть этот день будет наполнен радостью, улыбками и самыми близкими людьми! Оставайся такой же замечательной! 💖</p>
    </div>

</body>
</html>
